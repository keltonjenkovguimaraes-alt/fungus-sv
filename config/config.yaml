# FUNGUS-SV Configuration
# ========================
# Two-phase pipeline: ICB prediction + VALID-SV triangulation

# Sample identifiers (SRA accessions or local names)
samples:
  - DRR631664

# Reference genome paths
reference_genome: "data/reference/reference.fasta"
reference_gff: "data/reference/reference.gff"

# Phase 1: ICB Prediction parameters
icb:
  callers: ["pbsv", "sniffles2", "cutesv"]
  min_callers: 2
  min_overlap: 0.5
  haploid: true

# Phase 2: VALID-SV Triangulation parameters
validation:
  # Evidence layer weights (sum = 1.0)
  weights:
    alignment_consensus: 0.10
    local_assembly: 0.25
    depth_signature: 0.20
    kmer_spectrum: 0.25
    breakpoint_junction: 0.20
  
  # k-mer analysis
  kmer_size: 31
  kmer_db_dir: "results/validation/kmer_db"
  
  # Depth signature
  depth_window: 100
  depth_flank: 2000
  
  # Breakpoint analysis
  breakpoint_window: 500
  
  # FDR estimation
  fdr_null_proportion: 0.30  # Assumed max false positive rate
  
  # Triangulation thresholds
  tiers:
    triple_triangulated: 0.80
    double_confirmed: 0.60
    single_line: 0.40
    weak: 0.20

# LAR: Local Assembly Refinement
lar:
  flank_size: 2000
  min_reads: 10
  max_svs: null  # null = all, or set a number for testing

# Ploidy confirmation
ploidy:
  enabled: true
  max_het_rate: 0.02  # Haploid if heterozygous rate < 2%

# Output
output_dir: "results"
threads: 8
