# FUNGUS-SV Configuration
# ========================

# Sample names (match FASTQ files in data/raw/)
samples:
  - test_sample

# Reference genome
reference:
  fasta: "data/reference/reference.fasta"
  gff: "data/reference/reference.gff"

# ICB Consensus Parameters (from Liu et al. 2024)
icb:
  callers:
    - sniffles2
    - cutesv
    - svim
  min_callers: 2
  min_overlap: 0.5
  flank: 200

# Validation layer weights (CALIBRATED for haploid fungi)
# Depth > Breakpoint > Assembly > k-mer > Ploidy
# Original weights from Liu et al. (2024) Nature Comms: 0.30/0.25/0.25/0.20
# Recalibrated based on empirical validation of CICC-1445 vs S288C (2026-05-27)
# See docs/calibration_notes.md for full rationale
weights:
  local_assembly: 0.20
  depth_signature: 0.35
  kmer_spectrum: 0.15
  breakpoint_junction: 0.30
  ploidy_confirmation: 0.0  # hard filter, not scored

# Inversion-specific handling
# Inversions are systematically under-scored because depth and k-mer
# layers provide no signal for balanced inversions.
# All 11 inversions in CICC-1445 vs S288C were confirmed by split reads
# despite scoring CONTRADICTED (T=0.167).
inversion_scoring:
  enabled: true
  layers: [breakpoint_junction]  # only breakpoint layer applies
  report_as: "ICB-CONFIRMED / TRIANGULATION-LIMITED"

# Duplication-specific handling
# Duplications have ambiguous depth signal in haploid genomes.
# Split-read evidence is incorporated alongside depth.
duplication_scoring:
  enabled: true
  depth_threshold_haploid: 2.0  # DHFFC > 2.0 for confirmed DUP
  require_split_reads: true
  min_split_reads_per_breakpoint: 3

# DHFFC thresholds for haploid fungi
# Adapted from Pedersen & Quinlan (2019) GigaScience (human diploid: DEL < 0.7, DUP > 1.3)
# Haploid justification: true deletion = ~100% depth loss (DHFFC ≈ 0.0)
# See docs/calibration_notes.md for empirical evidence
dhffc:
  deletion_strong: 0.3     # DHFFC < 0.3 = confirmed DEL
  deletion_weak: 0.7       # 0.3 <= DHFFC < 0.7 = weak DEL
  duplication_strong: 2.0  # DHFFC > 2.0 = confirmed DUP
  duplication_weak: 1.3    # 1.3 < DHFFC <= 2.0 = weak DUP

# Read filtering (from Zheng & Shang 2024, PLOS ONE)
read_filters:
  min_mapq: 20                           # MAPQ >= 20 for validation
  max_coverage_multiple: 5               # flag regions > 5x genome average coverage
  require_span: true                      # reads must span full SV + flanks
  flank_len: 1000                         # flank length for read spanning check

# Split-read validation (from Zheng & Shang 2024, PLOS ONE)
split_read:
  distance_support_formula: "0.2 * sv_length + 2000 / sv_length"
  min_support_rate: 0.8   # >80% reads support = present (haploid)
  max_false_rate: 0.1     # <10% reads support = likely false
  min_split_reads: 3      # minimum split reads per breakpoint

# T-score thresholds (UNcalibrated — spike-in pending)
tscore_thresholds:
  high_confidence: 0.80
  medium_confidence: 0.60
  low_confidence: 0.40

# Minimum SV size
min_sv_size: 50

# Ploidy
ploidy: haploid
max_het_rate: 0.07  # 7% max heterozygous SNVs for haploid fungi
