<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUNGUS-SV | CICC-1445 Structural Variants</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 30px; text-align: center; border-bottom: 2px solid #30363d; }
.header h1 { font-size: 2em; color: #58a6ff; }
.header p { color: #8b949e; margin-top: 8px; }
.stats { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
.stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px 24px; text-align: center; min-width: 150px; cursor: pointer; transition: all 0.2s; }
.stat-card:hover { border-color: #58a6ff; transform: translateY(-2px); }
.stat-card h3 { font-size: 0.85em; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
.stat-card .num { font-size: 2em; font-weight: bold; margin: 5px 0; }
.stat-card .sub { font-size: 0.75em; color: #8b949e; }
.tabs { display: flex; justify-content: center; gap: 5px; padding: 0 20px; flex-wrap: wrap; }
.tab { padding: 10px 20px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; cursor: pointer; border-radius: 6px 6px 0 0; font-weight: 600; transition: all 0.2s; }
.tab:hover { background: #21262d; }
.tab.active { background: #1f6feb; border-color: #1f6feb; color: white; }
.container { max-width: 1500px; margin: 0 auto; padding: 20px; }
.chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 0 10px 10px 10px; padding: 20px; margin-bottom: 20px; }
canvas { width: 100%; display: block; }
.gene-section { margin-top: 20px; }
.gene-section h2 { color: #58a6ff; margin-bottom: 15px; }
.gene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.gene-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
.gene-card h4 { color: #f0f6fc; font-size: 0.9em; margin-bottom: 6px; }
.gene-card .count { color: #8b949e; font-size: 0.7em; margin-bottom: 6px; }
.gene-card .genes { color: #7ee787; font-size: 0.78em; word-break: break-word; line-height: 1.5; }
.footer { text-align: center; padding: 20px; color: #484f58; font-size: 0.8em; border-top: 1px solid #30363d; margin-top: 30px; }
</style>
</head>
<body>

<div class="header">
    <h1>FUNGUS-SV | Structural Variant Discovery</h1>
    <p>CICC-1445 (Query) vs 5 Reference Strains | PacBio HiFi | ICB Consensus (Sniffles2 + cuteSV + SVIM)</p>
</div>

<div class="stats" id="statsContainer"></div>

<div class="container">
    <div class="tabs" id="tabsContainer"></div>
    <div class="chart-container">
        <canvas id="genomeCanvas"></canvas>
    </div>
    <div class="gene-section" id="geneSection"></div>
</div>

<div class="footer">
    FUNGUS-SV &middot; Kelton Guimaraes et al. (2026) &middot; Hypothesis-generation tool &middot; All SVs require experimental validation
</div>

<script>
const svData = __SVDATA__;
const geneOverlap = __GENES__;
const summary = __SUMMARY__;
const strainColors = __COLORS__;
const chromNames = __CHROMS__;
const maxSize = __MAXSIZE__;
const strains = __STRAINS__;

let currentStrain = 'S288C';

const statsDiv = document.getElementById('statsContainer');
strains.forEach(s => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.style.borderLeft = '3px solid ' + strainColors[s];
    card.onclick = () => switchStrain(s);
    card.innerHTML = '<h3>' + s + '</h3><div class="num" style="color:' + strainColors[s] + '">' + summary[s].total + '</div><div class="sub">' + summary[s].DEL + ' DEL &middot; ' + summary[s].DUP + ' DUP &middot; ' + summary[s].INV + ' INV</div>';
    statsDiv.appendChild(card);
});

const tabsDiv = document.getElementById('tabsContainer');
strains.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => switchStrain(s);
    tabsDiv.appendChild(btn);
});

function switchStrain(s) {
    currentStrain = s;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent === s));
    drawGenome();
    showGenes();
}

function drawGenome() {
    const canvas = document.getElementById('genomeCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width - 200;
    const h = 920;
    canvas.width = rect.width * dpr;
    canvas.height = h * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    
    const data = svData[currentStrain];
    const rowH = 42;
    const startY = 20;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    chromNames.forEach((cname, i) => {
        const y = startY + i * rowH;
        const chrSize = data[cname].size;
        
        ctx.fillStyle = '#21262d';
        ctx.fillRect(150, y + 8, w, 20);
        ctx.strokeStyle = '#30363d';
        ctx.strokeRect(150, y + 8, w, 20);
        
        const total = data[cname].DEL.length + data[cname].DUP.length + data[cname].INV.length;
        ctx.fillStyle = total > 0 ? '#f0f6fc' : '#484f58';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(cname + ' [' + total + ']', 142, y + 23);
        
        const scale = w / chrSize;
        
        data[cname].DEL.forEach(sv => {
            const x = 150 + sv.start * scale;
            const sw = Math.max(3, sv.len * scale);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.75)';
            ctx.fillRect(x, y + 2, sw, 14);
        });
        
        data[cname].DUP.forEach(sv => {
            const x = 150 + sv.start * scale;
            const sw = Math.max(3, sv.len * scale);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.75)';
            ctx.fillRect(x, y + 16, sw, 14);
        });
        
        data[cname].INV.forEach(sv => {
            const x = 150 + sv.start * scale;
            const sw = Math.max(3, sv.len * scale);
            ctx.fillStyle = 'rgba(243, 156, 18, 0.75)';
            ctx.fillRect(x, y + 30, sw, 8);
        });
    });
    
    const ly = startY + chromNames.length * rowH + 25;
    ctx.fillStyle = 'rgba(231, 76, 60, 0.75)'; ctx.fillRect(150, ly, 22, 12);
    ctx.fillStyle = '#c9d1d9'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Deletion (' + summary[currentStrain].DEL + ')', 182, ly + 11);
    
    ctx.fillStyle = 'rgba(52, 152, 219, 0.75)'; ctx.fillRect(370, ly, 22, 12);
    ctx.fillText('Duplication (' + summary[currentStrain].DUP + ')', 402, ly + 11);
    
    ctx.fillStyle = 'rgba(243, 156, 18, 0.75)'; ctx.fillRect(590, ly, 22, 12);
    ctx.fillText('Inversion (' + summary[currentStrain].INV + ')', 622, ly + 11);
}

function showGenes() {
    const section = document.getElementById('geneSection');
    const genes = geneOverlap[currentStrain];
    const chromsWithGenes = Object.keys(genes);
    
    if (chromsWithGenes.length === 0) {
        section.innerHTML = '<p style="color: #8b949e; padding: 20px;">No gene overlap data available for this comparison (reference uses different annotation).</p>';
        return;
    }
    
    let totalGenes = 0;
    chromsWithGenes.forEach(c => totalGenes += genes[c].length);
    
    let html = '<h2>Genes Overlapping Structural Variants (' + totalGenes + ' total)</h2><div class="gene-grid">';
    chromsWithGenes.sort().forEach(c => {
        const geneList = genes[c].slice(0, 50);
        const extra = genes[c].length > 50 ? ' ... (+' + (genes[c].length - 50) + ' more)' : '';
        html += '<div class="gene-card"><h4>Chromosome ' + c + '</h4><div class="count">' + genes[c].length + ' genes affected</div><div class="genes">' + geneList.join(', ') + extra + '</div></div>';
    });
    html += '</div>';
    section.innerHTML = html;
}

drawGenome();
showGenes();
</script>
</body>
</html>
